<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>Admin</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:20px}
button{padding:10px;margin:5px}
</style>
</head>

<body>

<h1>Admin</h1>

<button id="create">Создать ссылку</button>
<button id="stopAll">Остановить все</button>
<button id="cleanup">Очистить истёкшие</button>

<div id="link"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSy...",
  databaseURL:"https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.getElementById("create").onclick = async () => {
  const token = Math.random().toString(36).slice(2);
  const now = Date.now();

  await set(ref(db,"liveSessions/"+token),{
    meta:{
      active:true,
      createdAt:now,
      expiresAt:now + 3600000
    },
    public:{
      lastPoint:null,
      recentPoints:{}
    },
    viewStats:{
      openCount:0
    }
  });

  document.getElementById("link").innerText =
    location.origin+"/live.html?session="+token;
};

document.getElementById("stopAll").onclick = async () => {
  const snap = await get(ref(db,"liveSessions"));
  const data = snap.val() || {};
  const updates = {};

  Object.keys(data).forEach(token=>{
    if(data[token]?.meta?.active){
      updates[`liveSessions/${token}/meta/active`] = false;
    }
  });

  await update(ref(db), updates);
  alert("Все остановлены");
};

document.getElementById("cleanup").onclick = async () => {
  const snap = await get(ref(db,"liveSessions"));
  const data = snap.val() || {};
  const now = Date.now();
  const updates = {};

  Object.keys(data).forEach(token=>{
    if(data[token]?.meta?.expiresAt < now){
      updates[`liveSessions/${token}`] = null;
    }
  });

  await update(ref(db), updates);
  alert("Очищено");
};
</script>

</body>
</html>
