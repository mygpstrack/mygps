<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyGps Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb}
    .wrap{max-width:1280px;margin:0 auto;padding:16px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:18px;padding:16px;margin-bottom:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e5e7eb}
    button{background:#2563eb;border:0;cursor:pointer}
    button.secondary{background:#374151}
    button.warn{background:#b45309}
    button.danger{background:#b91c1c}
    #map,#allMap{height:380px;border-radius:14px;overflow:hidden;border:1px solid #334155}
    .muted{color:#94a3b8}
    .mono{font-family:ui-monospace, monospace;word-break:break-all}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>MyGps Admin</h1>
    <p class="muted">Админка для пользователей, истории и live-сессий.</p>
    <div class="row" style="margin-top:12px">
      <button id="googleBtn">Войти через Google</button>
      <button id="logoutBtn" class="secondary">Выйти</button>
      <span id="userInfo" class="muted">Не авторизован</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label>Пользователь
        <select id="uidSelect"></select>
      </label>
      <button id="reloadBtn" class="secondary">Обновить</button>
      <button id="showAllBtn" class="secondary">Показать всех</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>История пользователя</h3>
      <div class="row">
        <input id="fromDate" type="datetime-local"/>
        <input id="toDate" type="datetime-local"/>
        <button id="todayBtn" class="secondary">Сегодня</button>
        <button id="yesterdayBtn" class="secondary">Вчера</button>
        <button id="weekBtn" class="secondary">Неделя</button>
        <button id="loadHistoryBtn">Показать</button>
      </div>
      <div id="map" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h3>Live-сессия</h3>
      <div class="row">
        <select id="durationMin">
          <option value="15">15 минут</option>
          <option value="30">30 минут</option>
          <option value="60" selected>1 час</option>
          <option value="180">3 часа</option>
        </select>
        <button id="createLiveBtn">Создать live</button>
        <button id="pauseLiveBtn" class="warn">Пауза</button>
        <button id="resumeLiveBtn" class="secondary">Продолжить</button>
        <button id="stopLiveBtn" class="danger">Стоп</button>
      </div>
      <p id="liveInfo" class="muted" style="margin-top:10px">Активная сессия: нет</p>
      <p id="liveLink" class="mono"></p>
    </div>
  </div>

  <div class="card">
    <h3>Все пользователи</h3>
    <div id="allMap"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXNCY-IpkhAXb8jNPhN8gf2UdOfPBc5gM",
  authDomain: "mygpslive-57196.firebaseapp.com",
  databaseURL: "https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mygpslive-57196",
  storageBucket: "mygpslive-57196.firebasestorage.app",
  messagingSenderId: "20781107701",
  appId: "1:20781107701:web:bd47061b9aca13abbeb8bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const qs = id => document.getElementById(id);
const provider = new GoogleAuthProvider();
let selectedUid = "";
let currentSessionId = "";
let users = [];
let allMarkers = [];
const map = L.map("map").setView([56.95,24.10],12);
const allMap = L.map("allMap").setView([56.95,24.10],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap"}).addTo(allMap);
const historyLine = L.polyline([], {weight:5}).addTo(map);

function fmt(ts){return ts?new Date(ts).toLocaleString("ru-RU"):"—";}
function setDefaults(){
  const now = new Date();
  const start = new Date(); start.setHours(0,0,0,0);
  qs("fromDate").value = start.toISOString().slice(0,16);
  qs("toDate").value = now.toISOString().slice(0,16);
}
setDefaults();

qs("todayBtn").onclick = () => setDefaults();
qs("yesterdayBtn").onclick = () => {
  const d = new Date(); d.setDate(d.getDate()-1);
  const s = new Date(d); s.setHours(0,0,0,0);
  const e = new Date(d); e.setHours(23,59,0,0);
  qs("fromDate").value = s.toISOString().slice(0,16);
  qs("toDate").value = e.toISOString().slice(0,16);
};
qs("weekBtn").onclick = () => {
  const now = new Date();
  const s = new Date(Date.now()-7*24*3600*1000);
  qs("fromDate").value = s.toISOString().slice(0,16);
  qs("toDate").value = now.toISOString().slice(0,16);
};

async function checkAdmin(user){
  const snap = await get(ref(db, `admins/${user.uid}`));
  return snap.val() === true;
}

async function loadUsers(){
  const [liveSnap, historySnap] = await Promise.all([
    get(ref(db, "live")),
    get(ref(db, "history"))
  ]);
  const liveKeys = Object.keys(liveSnap.val() || {});
  const historyKeys = Object.keys(historySnap.val() || {});
  users = [...new Set([...liveKeys, ...historyKeys])].sort();
  const sel = qs("uidSelect");
  sel.innerHTML = users.map(uid => `<option value="${uid}">${uid}</option>`).join("");
  if (!selectedUid && users.length) selectedUid = users[0];
  if (selectedUid) sel.value = selectedUid;
}

async function loadHistory(){
  if (!selectedUid) return;
  const raw = (await get(ref(db, `history/${selectedUid}`))).val() || {};
  const from = new Date(qs("fromDate").value).getTime();
  const to = new Date(qs("toDate").value).getTime();
  const pts = Object.values(raw).filter(Boolean).filter(p => (p.timestamp||0)>=from && (p.timestamp||0)<=to).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const latlngs = pts.map(p => [Number(p.latitude), Number(p.longitude)]);
  historyLine.setLatLngs(latlngs);
  if (latlngs.length > 1) map.fitBounds(historyLine.getBounds(), {padding:[20,20]});
  else if (latlngs.length === 1) map.setView(latlngs[0], 15);
}

async function loadCurrentSession(){
  if (!selectedUid) return;
  const ownerSnap = await get(ref(db, `liveOwners/${selectedUid}/activeSessionId`));
  currentSessionId = ownerSnap.val() || "";
  if (!currentSessionId) {
    qs("liveInfo").textContent = "Активная сессия: нет";
    qs("liveLink").textContent = "";
    return;
  }
  const meta = (await get(ref(db, `liveSessions/${currentSessionId}/meta`))).val() || {};
  qs("liveInfo").textContent = `Активная сессия: ${currentSessionId} • ${meta.paused ? "пауза" : meta.active ? "активна" : "остановлена"} • до ${fmt(meta.expiresAt)}`;
  qs("liveLink").textContent = meta.link || "";
}

async function createLive(){
  if (!selectedUid) return;
  const mins = Number(qs("durationMin").value || 60);
  const token = (crypto.randomUUID().replace(/-/g,"")).slice(0,24);
  const now = Date.now();
  const expiresAt = now + mins*60*1000;
  const link = `https://mygpstrack.github.io/mygps/live.html?session=${token}`;
  const liveSnap = await get(ref(db, `live/${selectedUid}/recentPoints`));
  const pts = Object.values(liveSnap.val() || {}).filter(Boolean).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).slice(-200);
  const recent = {};
  pts.forEach(p => { recent[String(p.timestamp||Date.now())] = p; });
  const lastPoint = pts.length ? pts[pts.length-1] : null;
  await update(ref(db), {
    [`liveSessions/${token}/meta`]: {
      ownerUid: selectedUid, active: true, paused: false,
      createdAt: now, expiresAt, remainingMs: mins*60*1000,
      link, durationMinutes: mins
    },
    [`liveSessions/${token}/public/lastPoint`]: lastPoint,
    [`liveSessions/${token}/public/recentPoints`]: recent,
    [`liveOwners/${selectedUid}/activeSessionId`]: token,
    [`liveOwners/${selectedUid}/updatedAt`]: now
  });
  currentSessionId = token;
  await loadCurrentSession();
}

async function setLivePaused(paused){
  if (!currentSessionId) return;
  const metaRef = ref(db, `liveSessions/${currentSessionId}/meta`);
  const meta = (await get(metaRef)).val() || {};
  const now = Date.now();
  let patch = {};
  if (paused) {
    const remainingMs = Math.max(0, (meta.expiresAt||now)-now);
    patch = { paused: true, pausedAt: now, remainingMs };
  } else {
    const remainingMs = Number(meta.remainingMs || 0);
    patch = { paused: false, pausedAt: null, expiresAt: now + remainingMs };
  }
  await update(metaRef, patch);
  await loadCurrentSession();
}

async function stopLive(){
  if (!currentSessionId) return;
  const now = Date.now();
  await update(ref(db), {
    [`liveSessions/${currentSessionId}/meta/active`]: false,
    [`liveSessions/${currentSessionId}/meta/paused`]: false,
    [`liveSessions/${currentSessionId}/meta/endedAt`]: now,
    [`liveOwners/${selectedUid}/activeSessionId`]: null,
    [`liveOwners/${selectedUid}/updatedAt`]: now
  });
  currentSessionId = "";
  await loadCurrentSession();
}

async function renderAllUsers(){
  allMarkers.forEach(m => allMap.removeLayer(m));
  allMarkers = [];
  const snap = await get(ref(db, "live"));
  const data = snap.val() || {};
  const bounds = [];
  Object.entries(data).forEach(([uid, value]) => {
    const p = value?.lastPoint;
    if (!p || p.latitude == null || p.longitude == null) return;
    const latlng = [Number(p.latitude), Number(p.longitude)];
    const marker = L.marker(latlng).addTo(allMap).bindPopup(`${uid}<br>${fmt(p.timestamp)}`);
    allMarkers.push(marker); bounds.push(latlng);
  });
  if (bounds.length) allMap.fitBounds(bounds, {padding:[20,20]});
}

qs("googleBtn").onclick = async () => { await signInWithPopup(auth, provider); };
qs("logoutBtn").onclick = async () => { await signOut(auth); };
qs("uidSelect").onchange = async e => { selectedUid = e.target.value; await loadHistory(); await loadCurrentSession(); };
qs("reloadBtn").onclick = async () => { await loadUsers(); await loadHistory(); await loadCurrentSession(); await renderAllUsers(); };
qs("showAllBtn").onclick = renderAllUsers;
qs("loadHistoryBtn").onclick = loadHistory;
qs("createLiveBtn").onclick = createLive;
qs("pauseLiveBtn").onclick = () => setLivePaused(true);
qs("resumeLiveBtn").onclick = () => setLivePaused(false);
qs("stopLiveBtn").onclick = stopLive;

onAuthStateChanged(auth, async user => {
  if (!user) {
    qs("userInfo").textContent = "Не авторизован";
    return;
  }
  const isAdmin = await checkAdmin(user);
  if (!isAdmin) {
    alert("Этот аккаунт не является админом.");
    await signOut(auth);
    return;
  }
  qs("userInfo").textContent = `${user.email || user.uid} • admin`;
  await loadUsers(); await loadHistory(); await loadCurrentSession(); await renderAllUsers();
});
</script>
</body>
</html>
