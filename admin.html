<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Admin FIXED</title>
</head>
<body>
<h1>ADMIN UI READY (FIXED)</h1>

<script>
function showToast(text){
  const el = document.createElement("div");
  el.innerText = text;
  el.style.position = "fixed";
  el.style.bottom = "20px";
  el.style.right = "20px";
  el.style.background = "#22c55e";
  el.style.color = "#fff";
  el.style.padding = "10px 16px";
  el.style.borderRadius = "10px";
  el.style.zIndex = 9999;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}

function testClick(name){
  console.log("click", name);
  showToast(name + " выполнено");
}
</script>

<button onclick="testClick('Очистить history')">Очистить history</button>
<button onclick="testClick('Очистить live')">Очистить live</button>
<button onclick="testClick('Удалить период')">Удалить период</button>

</body>
</html>
