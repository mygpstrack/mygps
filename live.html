<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MyGps Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --bg:#0b1220;
  --panel:rgba(0,0,0,.75);
  --panel-card:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#cbd5e1;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --gray:#94a3b8;
  --blue:#3b82f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#map{position:absolute;inset:0;z-index:1}
.top{
  position:fixed;top:10px;left:10px;right:10px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:1000;
}
.time-normal{color:var(--text)}
.time-warn{color:var(--yellow)}
.time-danger{color:var(--red)}
.card{
  background:rgba(0,0,0,.62);
  padding:10px;border-radius:12px;
  font-size:13px;text-align:center;
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  box-shadow:0 10px 26px rgba(0,0,0,.24);
}
.card b{font-size:15px;line-height:1.15}
.bottom{
  position:fixed;left:10px;right:10px;bottom:10px;
  background:var(--panel);
  border-radius:18px;padding:10px;
  z-index:1000;border:1px solid var(--line);
  box-shadow:0 -10px 30px rgba(0,0,0,.32);
  backdrop-filter:blur(12px);
}
.bottom.full{max-height:55vh;overflow:auto}
button{
  width:100%;padding:10px;border:none;
  border-radius:10px;background:#1f2937;color:#fff;
  font-size:14px;font-weight:bold;cursor:pointer;
}
.details{display:none;margin-top:10px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{
  background:var(--panel-card);
  padding:8px;border-radius:10px;
  line-height:1.35;border:1px solid var(--line);
}
.followBtn{margin-top:10px;background:#14532d}
.followBtn.off{background:#7f1d1d}
.alert{
  position:fixed;top:30%;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.78);
  padding:14px 16px;border-radius:14px;display:none;z-index:2000;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 34px rgba(0,0,0,.35);
  min-width:280px;max-width:88vw;text-align:center;font-weight:800;
}
.alert small{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:700}
.end-overlay{
  position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at top,#111827,#020617 70%);
  padding:22px;
}
.end-card{
  width:min(92vw,420px);
  background:rgba(15,23,42,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;padding:26px 20px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.38)
}
.end-icon{font-size:52px;line-height:1}
.end-title{font-size:28px;font-weight:900;margin-top:12px}
.end-text{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.5}
.marker-arrow{
  width:0;height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-bottom:22px solid var(--green);
  transform-origin:50% 80%;
}
.marker-circle{
  width:16px;height:16px;border-radius:50%;
  border:3px solid white;
}
.leaflet-control-attribution{
  opacity:.18;
  font-size:10px;
  background:rgba(0,0,0,.10) !important;
  color:#d1d5db !important;
  padding:2px 6px !important;
  border-radius:10px 0 0 0;
}
.leaflet-control-attribution a{color:#d1d5db !important;text-decoration:none}
@media (max-width: 768px){
  .bottom{left:8px;right:8px;bottom:8px}
  .top{left:8px;right:8px;top:8px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="card">Погода<br><b id="weather">—</b></div>
  <div class="card">Локация<br><b id="location">—</b></div>
  <div class="card">Статус<br><b id="status">—</b></div>
  <div class="card">Скорость<br><b id="speed">—</b></div>
  <div class="card">Обновлено<br><b id="updated">—</b></div>
  <div class="card">Осталось<br><b id="time">—</b></div>
</div>

<div class="bottom" id="panel">
  <button onclick="togglePanel()" id="toggleBtn">Подробнее</button>

  <div class="details" id="details">
    <div class="grid">
      <div class="box">Статус: <span id="d_status"></span></div>
      <div class="box">Скорость: <span id="d_speed"></span></div>
      <div class="box">Обновлено: <span id="d_updated"></span></div>
      <div class="box">Осталось: <span id="d_time"></span></div>
      <div class="box">GPS / Сигнал: <span id="d_bearing"></span></div>
      <div class="box">Тип: <span id="d_type">—</span></div>
      <div class="box">Координаты: <span id="d_coords"></span></div>
      <div class="box">Сигнал: <span id="d_signal"></span></div>
      <div class="box">Точность: <span id="d_tail"></span></div>
            <div class="box">Возраст точки: <span id="d_age"></span></div>
    </div>

    <button class="followBtn" id="followBtn" onclick="toggleFollow()">🎯 Слежение: Вкл</button>
  </div>
</div>

<div class="alert" id="alert"></div>

<div class="end-overlay" id="endOverlay">
  <div class="end-card">
    <div class="end-icon">❌</div>
    <div class="end-title">Трансляция завершена</div>
    <div class="end-text" id="endText">Эта live-ссылка больше недоступна.</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCXNCY-IpkhAXb8jNPhN8gf2UdOfPBc5gM",
  authDomain:"mygpslive-57196.firebaseapp.com",
  databaseURL:"https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"mygpslive-57196",
  storageBucket:"mygpslive-57196.firebasestorage.app",
  messagingSenderId:"20781107701",
  appId:"1:20781107701:web:bd47061b9aca13abbeb8bc",
  measurementId:"G-BSCVNY9LH0"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const qs=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const sessionId=params.get("session");

const map=L.map('map').setView([56.95,24.1],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{crossOrigin:true}).addTo(map);

let marker=null;
let follow=true;
let open=false;
let tailPoints=[];
let tailLine=L.polyline([], {color:'#3b82f6', weight:4, opacity:0.9}).addTo(map);
let warnedFive=false;
let warnedOne=false;
let lastPoint=null;
let displayPoint=null;
let animationFrameId=null;
let lastPausedState=null;
let currentSessionMeta=null;

function togglePanel(){
  open=!open;
  qs('details').style.display=open?'block':'none';
  qs('panel').classList.toggle('full',open);
  qs('toggleBtn').innerText=open?'Скрыть':'Подробнее';
}
window.togglePanel=togglePanel;

function setFollowUi(){
  const btn=qs('followBtn');
  btn.innerText=follow?'🎯 Слежение: Вкл':'❌ Слежение: Выкл';
  btn.classList.toggle('off',!follow);
}

function toggleFollow(){
  follow=!follow;
  setFollowUi();
  if(follow && displayPoint) map.panTo([displayPoint.lat,displayPoint.lng], {animate:true});
}
window.toggleFollow=toggleFollow;

function showAlert(text, tone='default'){
  const el=qs('alert');
  el.innerHTML=text+'<small>Предупреждение по времени ссылки</small>';
  el.style.display='block';
  el.style.background = tone === 'danger' ? 'rgba(127,29,29,.92)' : 'rgba(0,0,0,.78)';
  el.style.borderColor = tone === 'danger' ? 'rgba(248,113,113,.55)' : 'rgba(255,255,255,.12)';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.display='none',5000);
}

function showEnd(message){
  qs('endText').textContent=message || 'Эта live-ссылка больше недоступна.';
  qs('endOverlay').style.display='flex';
}
function hideEnd(){ qs('endOverlay').style.display='none'; }

function relTime(ts){
  if(!ts) return '—';
  const sec=Math.max(0, Math.floor((Date.now()-ts)/1000));
  if(sec<60) return sec+' сек';
  const min=Math.floor(sec/60);
  if(min<60) return min+' мин';
  const h=Math.floor(min/60);
  return h+' ч';
}
function fmtClock(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtCountdown(ms){
  if(ms<=0) return '0:00';
  const sec=Math.floor(ms/1000), m=Math.floor(sec/60), s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}

function checkTimeWarnings(leftMs, isPaused){
  if(isPaused) return;
  if(leftMs<=5*60*1000 && !warnedFive && leftMs>60*1000){
    warnedFive=true;
    showAlert('Время действия ссылки заканчивается через '+fmtCountdown(leftMs));
  }
  if(leftMs<=60*1000 && !warnedOne && leftMs>0){
    warnedOne=true;
    showAlert('Время действия ссылки заканчивается через '+fmtCountdown(leftMs), 'danger');
  }
}
function distanceMeters(a,b){
  const toRad=v=>v*Math.PI/180,R=6371000;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lng-a.lng), lat1=toRad(a.lat), lat2=toRad(b.lat);
  const x=Math.sin(dLat/2)**2+Math.sin(dLon/2)**2*Math.cos(lat1)*Math.cos(lat2);
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}
function filterJumps(list){
  const out=[];
  for(const p of list){
    if(!out.length){ out.push(p); continue; }
    const prev=out[out.length-1];
    const dt=Math.max(1,(p.ts-prev.ts)/1000);
    const speedCalc=(distanceMeters(prev,p)/dt)*3.6;
    if(speedCalc>250) continue;
    out.push(p);
  }
  return out;
}
function smoothPoint(prev, cur){
  if(!prev) return {...cur};
  const alpha = 0.35;
  return {
    ...cur,
    lat: prev.lat + (cur.lat - prev.lat) * alpha,
    lng: prev.lng + (cur.lng - prev.lng) * alpha
  };
}

function getMoveType(points, currentPoint){
  const sample = (points && points.length ? points : [currentPoint])
    .slice(-5)
    .map(p => Number(p.speed || 0))
    .filter(v => Number.isFinite(v));

  if(!sample.length) return '—';

  const avg = sample.reduce((a,b)=>a+b,0) / sample.length;

  if(avg < 2) return 'Стоит';
  if(avg < 12) return 'Пешком';
  return 'Авто/Мото';
}

function getStatusMeta(p, sessionMeta){
  if(sessionMeta?.paused){
    return {status:'Приостановлено', signal:'—', type:'paused'};
  }
  const ageMs=(p.ts ? Date.now()-p.ts : 0);
  const speed = Number(p.speed || 0);

  if(ageMs > 10 * 60 * 1000) return {status:'Нет сигнала', signal:'Потерян', type:'offline'};
  if(speed > 2) return {status:'Движение', signal:'Хороший', type:'moving'};
  if(ageMs >= 5 * 60 * 1000) return {status:'Стоянка', signal:'Есть', type:'stop_long'};
  return {status:'Стоит', signal:'Есть', type:'stop_short'};
}

function buildIconHtml(p, sessionMeta){
  const meta=getStatusMeta(p, sessionMeta);
  if(meta.type==='offline'){
    return `<div class="marker-circle" style="background:#94a3b8"></div>`;
  }
  if(meta.type==='moving'){
    return `<div class="marker-arrow" style="transform:rotate(${p.bearing||0}deg)"></div>`;
  }
  if(meta.type==='paused'){
    return `<div class="marker-circle" style="background:#3b82f6"></div>`;
  }
  const color=meta.type==='stop_long' ? '#ef4444' : '#f59e0b';
  return `<div class="marker-circle" style="background:${color}"></div>`;
}

function setMarkerIcon(p, sessionMeta){
  const icon=L.divIcon({html:buildIconHtml(p, sessionMeta), className:''});
  if(!marker){
    marker=L.marker([p.lat,p.lng],{icon}).addTo(map);
  }else{
    marker.setIcon(icon);
  }
}

function animateMarkerTo(target, sessionMeta){
  if(!target) return;
  if(!marker){
    setMarkerIcon(target, sessionMeta);
    marker=L.marker([target.lat,target.lng],{icon:L.divIcon({html:buildIconHtml(target, sessionMeta), className:''})}).addTo(map);
    displayPoint = {...target};
    return;
  }

  if(!displayPoint){
    displayPoint = {...target};
    marker.setLatLng([target.lat, target.lng]);
    marker.setIcon(L.divIcon({html:buildIconHtml(target, sessionMeta), className:''}));
    return;
  }

  const start = {lat: displayPoint.lat, lng: displayPoint.lng};
  const end = {lat: target.lat, lng: target.lng};
  const duration = 900;
  const started = performance.now();

  if(animationFrameId) cancelAnimationFrame(animationFrameId);

  function step(now){
    const t = Math.min(1, (now - started) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const lat = start.lat + (end.lat - start.lat) * eased;
    const lng = start.lng + (end.lng - start.lng) * eased;
    marker.setLatLng([lat,lng]);
    marker.setIcon(L.divIcon({html:buildIconHtml(target, sessionMeta), className:''}));
    displayPoint = {...target, lat, lng};
    if(t < 1){
      animationFrameId=requestAnimationFrame(step);
    }
  }
  animationFrameId=requestAnimationFrame(step);
}

function updateUi(p, expiresAt, sessionMeta){
  const meta=getStatusMeta(p, sessionMeta);
  const leftMs = sessionMeta?.paused
    ? Math.max(0, Number(sessionMeta?.remainingMs || 0))
    : (expiresAt ? Math.max(0, Number(expiresAt)-Date.now()) : 0);
  const leftText=expiresAt || sessionMeta?.paused ? fmtCountdown(leftMs) : '—';

  qs('status').innerText=meta.status;
  qs('speed').innerText=(Number(p.speed||0)).toFixed(1)+' км/ч';
  qs('updated').innerText=relTime(p.ts);
  qs('time').innerText=leftText;
  qs('time').className = leftMs <= 60000 ? 'time-danger' : (leftMs <= 300000 ? 'time-warn' : 'time-normal');

  let gpsState='OK';
  const ageMs = Date.now() - Number(p.ts || 0);
  const accuracy = Number(p.accuracy || 0);
  if(ageMs > 10 * 60 * 1000) gpsState='Нет сигнала';
  else if(ageMs > 2 * 60 * 1000) gpsState='Точка старая';
  else if(accuracy > 50) gpsState='Слабый';
  else gpsState='OK';

  qs('d_status').innerText=meta.status;
  qs('d_speed').innerText=(Number(p.speed||0)).toFixed(1)+' км/ч';
  qs('d_updated').innerText=fmtClock(p.ts)+' ('+relTime(p.ts)+' назад)';
  qs('d_time').innerText=leftText;
  qs('d_bearing').innerText=gpsState;
  qs('d_coords').innerText=Number(p.lat).toFixed(5)+', '+Number(p.lng).toFixed(5);
  qs('d_signal').innerText=meta.signal;
  qs('d_tail').innerText=accuracy>0 ? Math.round(accuracy)+' м' : '—';
  qs('d_age').innerText=relTime(p.ts)+' назад';
  qs('d_type').innerText = sessionMeta?.moveType || '—';

  checkTimeWarnings(leftMs, !!sessionMeta?.paused);
  if(!sessionMeta?.paused && leftMs<=0 && expiresAt){
    showEnd('Время действия ссылки истекло.');
  }
}

function normalizePoint(p){
  return {
    lat:Number(p.latitude ?? p.lat),
    lng:Number(p.longitude ?? p.lng),
    speed:Number(p.speed ?? 0),
    bearing:Number(p.bearing ?? 0),
    accuracy:Number(p.accuracy ?? p.acc ?? 0),
    ts:Number(p.timestamp ?? p.ts ?? Date.now())
  };
}

function applySession(data){
  if(!data){ showEnd('Ссылка не найдена или была удалена.'); return; }
  const meta=data.meta||{};
  currentSessionMeta=meta;

  if(lastPausedState!==null && lastPausedState!==!!meta.paused){
    showAlert(meta.paused ? '⏸ Трансляция приостановлена' : '▶️ Трансляция продолжена');
  }
  lastPausedState=!!meta.paused;

  if(meta.active===false){ showEnd('Эта трансляция была остановлена владельцем.'); return; }
  if(!meta.paused && meta.expiresAt && Number(meta.expiresAt)<=Date.now()){ showEnd('Время действия ссылки истекло.'); return; }
  hideEnd();

  const recent = Object.values(data.public?.recentPoints || {})
    .filter(Boolean)
    .map(normalizePoint)
    .sort((a,b)=>a.ts-b.ts);
  const filtered = filterJumps(recent);

  const fallbackPoint =
    data.public?.lastPoint ||
    data.lastPoint ||
    data.live?.lastPoint ||
    data.live ||
    filtered[filtered.length-1] ||
    null;

  const point = fallbackPoint ? normalizePoint(fallbackPoint) : null;
  if(!point || !Number.isFinite(point.lat) || !Number.isFinite(point.lng)) return;

  const smoothed = smoothPoint(lastPoint, point);
  lastPoint = {...point};

  setMarkerIcon(point, meta);
  if(!marker){
    marker=L.marker([smoothed.lat,smoothed.lng],{icon:L.divIcon({html:buildIconHtml(point, meta), className:''})}).addTo(map);
    displayPoint = {...smoothed};
  }else{
    animateMarkerTo(smoothed, meta);
  }

  tailPoints = filtered.slice(-30).map(p=>[p.lat,p.lng]);
  tailLine.setLatLngs(tailPoints);
  updateUi(smoothed, meta.expiresAt, meta);
  fetchWeather(smoothed.lat, smoothed.lng);

  if(follow) map.panTo([smoothed.lat, smoothed.lng], {animate:true});
}

map.on('dragstart',()=>{
  follow=false;
  setFollowUi();
  clearTimeout(window._followTimer);
  window._followTimer=setTimeout(()=>{
    follow=true;
    setFollowUi();
    if(displayPoint) map.panTo([displayPoint.lat,displayPoint.lng], {animate:true});
  },7000);
});

setFollowUi();


let weatherCache=null;
let locationCache=null;
let lastWeatherFetch=0;
let lastWeatherCoords=null;

function windDir(deg){
  const dirs=["С","СВ","В","ЮВ","Ю","ЮЗ","З","СЗ"];
  return dirs[Math.round(deg/45)%8];
}

function distKm(a,b){
  const toRad=v=>v*Math.PI/180, R=6371;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lng-a.lng);
  const lat1=toRad(a.lat), lat2=toRad(b.lat);
  const x=Math.sin(dLat/2)**2+Math.sin(dLon/2)**2*Math.cos(lat1)*Math.cos(lat2);
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

async function fetchCityCountry(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=en`);
    const j=await r.json();
    const a=j.address||{};
    const city=a.city || a.town || a.village || a.municipality || a.county || "";
    const cc=(a.country_code || "").toUpperCase();
    const text=[city, cc].filter(Boolean).join(", ");
    if(text){
      locationCache=text;
      qs('location').innerText=text;
    }else if(locationCache){
      qs('location').innerText=locationCache;
    }
    return text;
  }catch(e){
    if(locationCache) qs('location').innerText=locationCache;
    return locationCache || "";
  }
}

async function fetchWeather(lat,lng){
  const now=Date.now();
  const curr={lat,lng};

  if(lastWeatherCoords){
    const d=distKm(lastWeatherCoords, curr);
    if(d < 3 && now-lastWeatherFetch < 600000 && weatherCache){
      qs("weather").innerText=weatherCache;
      if(locationCache) qs("location").innerText=locationCache;
      return;
    }
  }else if(now-lastWeatherFetch < 600000 && weatherCache){
    qs("weather").innerText=weatherCache;
    if(locationCache) qs("location").innerText=locationCache;
    return;
  }

  try{
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
    const j=await res.json();
    const w=j.current_weather;
    if(!w) return;

    const temp=Math.round(w.temperature);
    const wind=Math.round(w.windspeed);
    const dir=windDir(w.winddirection);
    weatherCache=`+${temp}°C
${dir} ветер ${wind} м/с`;
    lastWeatherFetch=now;
    lastWeatherCoords={lat,lng};
    qs("weather").innerText=weatherCache;

    await fetchCityCountry(lat,lng);
  }catch(e){
    if(weatherCache) qs("weather").innerText=weatherCache;
    if(locationCache) qs("location").innerText=locationCache;
  }
}

setInterval(() => {
  if(!lastPoint) return;
  const meta = getStatusMeta(lastPoint, currentSessionMeta);
  qs('updated').innerText = relTime(lastPoint.ts);
  qs('d_updated').innerText = fmtClock(lastPoint.ts)+' ('+relTime(lastPoint.ts)+' назад)';
  qs('status').innerText = meta.status;
  qs('d_status').innerText = meta.status;
  qs('d_signal').innerText = meta.signal;

  const leftMs = currentSessionMeta?.paused
    ? Math.max(0, Number(currentSessionMeta?.remainingMs || 0))
    : (currentSessionMeta?.expiresAt ? Math.max(0, Number(currentSessionMeta.expiresAt)-Date.now()) : null);

  if(leftMs !== null){
    const txt = fmtCountdown(leftMs);
    qs('time').innerText = txt;
    qs('d_time').innerText = txt;
    qs('time').className = leftMs <= 60000 ? 'time-danger' : (leftMs <= 300000 ? 'time-warn' : 'time-normal');
    checkTimeWarnings(leftMs, !!currentSessionMeta?.paused);
    if(!currentSessionMeta?.paused && leftMs<=0){
      showEnd('Время действия ссылки истекло.');
    }
  }
}, 1000);

if(!sessionId){
  showEnd('Неверная ссылка (нет session).');
}else{
  const sessionRef=ref(db, `liveSessions/${sessionId}`);
  onValue(sessionRef, snap => {
    applySession(snap.val());
  }, err => {
    console.error(err);
    showEnd('Не удалось загрузить live-сессию.');
  });
}
</script>
</body>
</html>
