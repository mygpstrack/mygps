<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MyGps Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    body{margin:0;font-family:system-ui;background:#08111f;color:#e5e7eb}
    #map{position:fixed;inset:0}
    .panel{position:fixed;left:16px;right:16px;top:16px;z-index:1000;background:rgba(17,24,39,.92);border:1px solid rgba(148,163,184,.16);border-radius:20px;padding:16px;backdrop-filter:blur(8px)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05)}
    .dot{width:10px;height:10px;border-radius:50%}.green{background:#22c55e}.yellow{background:#eab308}.red{background:#ef4444}
    .muted{color:#94a3b8}
  </style>
</head>
<body>
<div class="panel">
  <div class="row">
    <div class="pill"><span id="dot" class="dot yellow"></span><span id="status">Проверка…</span></div>
    <div class="pill">Сессия: <span id="sessionText" class="muted">—</span></div>
    <div class="pill">Осталось: <span id="remain">—</span></div>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="muted" id="message">Ожидание данных…</div>
  </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const params = new URLSearchParams(location.search);
const sessionId = params.get("session") || "";
const qs = id => document.getElementById(id);
qs("sessionText").textContent = sessionId || "—";

const firebaseConfig = {
  apiKey: "AIzaSyCXNCY-IpkhAXb8jNPhN8gf2UdOfPBc5gM",
  authDomain: "mygpslive-57196.firebaseapp.com",
  databaseURL: "https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mygpslive-57196",
  storageBucket: "mygpslive-57196.firebasestorage.app",
  messagingSenderId: "20781107701",
  appId: "1:20781107701:web:bd47061b9aca13abbeb8bc"
};

function fmtRemain(ms){
  const sec=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(sec/3600); const m=Math.floor((sec%3600)/60); const s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function setState(text,color,msg){ qs("status").textContent=text; qs("dot").className=`dot ${color}`; qs("message").textContent=msg; }

if (!sessionId) {
  setState("Недействительная ссылка","red","Не найден параметр session");
} else {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const metaRef = ref(db, `liveSessions/${sessionId}/meta`);
  const lastPointRef = ref(db, `liveSessions/${sessionId}/public/lastPoint`);
  const recentRef = ref(db, `liveSessions/${sessionId}/public/recentPoints`);

  const map = L.map("map").setView([56.95,24.10],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap"}).addTo(map);
  const poly = L.polyline([], {weight:5}).addTo(map);
  const marker = L.circleMarker([56.95,24.10], {radius:8,color:"#22c55e",fillColor:"#22c55e",fillOpacity:1}).addTo(map);

  let timer = null, currentMeta = null;
  function stopTimer(){ if (timer) clearInterval(timer); timer = null; }
  function tick(){
    if (!currentMeta) return;
    const now = Date.now();
    if (!currentMeta.active) {
      setState("Трансляция завершена","red","Эта live-сессия остановлена.");
      qs("remain").textContent = "00:00";
      return;
    }
    if (currentMeta.paused) {
      setState("Трансляция на паузе","yellow","Время на странице остановлено.");
      qs("remain").textContent = fmtRemain(Number(currentMeta.remainingMs || 0));
      return;
    }
    const remain = Math.max(0, Number(currentMeta.expiresAt || 0) - now);
    qs("remain").textContent = fmtRemain(remain);
    if (remain <= 0) {
      setState("Ссылка истекла","red","Срок действия этой live-ссылки закончился.");
    } else {
      setState("Трансляция активна","green","Маршрут обновляется в реальном времени.");
    }
  }

  onValue(metaRef, snap => {
    currentMeta = snap.val();
    if (!currentMeta) {
      stopTimer();
      setState("Сессия не найдена","red","Сессия удалена или недоступна.");
      return;
    }
    stopTimer();
    tick();
    timer = setInterval(tick, 1000);
  }, () => {
    stopTimer();
    setState("Нет доступа","red","Ссылка недоступна правилами Firebase.");
  });

  onValue(lastPointRef, snap => {
    const p = snap.val();
    if (!p || p.latitude == null || p.longitude == null) return;
    marker.setLatLng([Number(p.latitude), Number(p.longitude)]);
  });

  onValue(recentRef, snap => {
    const pts = Object.values(snap.val() || {}).filter(Boolean).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const latlngs = pts.map(p => [Number(p.latitude), Number(p.longitude)]);
    poly.setLatLngs(latlngs);
    if (latlngs.length > 1) map.fitBounds(poly.getBounds(), {padding:[20,20]});
    else if (latlngs.length === 1) map.setView(latlngs[0], 15);
  });
}
</script>
</body>
</html>
