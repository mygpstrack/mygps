<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MyGps Live</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;}
#map{position:fixed;inset:0;}

.sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:#111827;border-radius:20px 20px 0 0;
  padding:14px;z-index:2;transition:.3s;
}
.handle{width:40px;height:4px;background:#555;margin:0 auto 10px;border-radius:10px;}

.dot{width:10px;height:10px;border-radius:50%;}
.green{background:#22c55e}
.yellow{background:#eab308}
.red{background:#ef4444}
</style>
</head>

<body>

<div id="map"></div>

<div class="sheet" id="sheet">
  <div class="handle"></div>

  <div style="display:flex;gap:6px;align-items:center">
    <div id="dot" class="dot green"></div>
    <div id="status">Загрузка...</div>
  </div>

  <div id="coords">—</div>
  <div id="timer">—</div>
  <div id="updated">—</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  databaseURL: "https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app"
};

const token = new URLSearchParams(location.search).get("session");

if(!token){
  document.body.innerHTML = "<h2 style='padding:20px'>Нет доступа</h2>";
  throw new Error();
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const map = L.map("map").setView([56.95,24.10],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const marker = L.circleMarker([56.95,24.10],{
  radius:8,color:"#22c55e",fillColor:"#22c55e",fillOpacity:1
}).addTo(map);

const line = L.polyline([], {weight:5}).addTo(map);

let lastMove = Date.now();

function updateStatus(speed){
  const dot = document.getElementById("dot");

  if(speed > 2){
    dot.className="dot green";
    document.getElementById("status").innerText="Движение";
    lastMove = Date.now();
  } else {
    const idle = Date.now()-lastMove;

    if(idle > 15*60*1000){
      dot.className="dot red";
      document.getElementById("status").innerText="Стоит долго";
    } else if(idle > 5*60*1000){
      dot.className="dot yellow";
      document.getElementById("status").innerText="Стоит";
    }
  }
}

onValue(ref(db,`liveSessions/${token}/public/recentPoints`),snap=>{
  const pts = Object.values(snap.val()||{});
  const latlngs = pts.map(p=>[p.latitude,p.longitude]);

  line.setLatLngs(latlngs);

  if(latlngs.length){
    const last = pts[pts.length-1];

    marker.setLatLng([last.latitude,last.longitude]);
    map.fitBounds(line.getBounds());

    document.getElementById("coords").innerText =
      last.latitude.toFixed(5)+", "+last.longitude.toFixed(5);

    document.getElementById("updated").innerText =
      new Date(last.timestamp).toLocaleTimeString();

    updateStatus(last.speed || 0);
  }
});

onValue(ref(db,`liveSessions/${token}/meta`),snap=>{
  const m = snap.val();
  if(!m)return;

  setInterval(()=>{
    const r = Math.max(0, m.expiresAt - Date.now());
    const min = Math.floor(r/60000);
    const sec = Math.floor((r%60000)/1000);

    document.getElementById("timer").innerText =
      "Истекает через "+min+"м "+sec+"с";
  },1000);
});
</script>

</body>
</html>
