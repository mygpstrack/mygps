<!DOCTYPE html>
<html>
<head>
  <title>Live GPS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // 🔑 Вставь сюда свой firebaseConfig
  const firebaseConfig = {
    apiKey: "AIzaSyAGOxdUH7qky6jt4aejCaxmxhiIue2Jlb8",
    authDomain: "mygpslive-57196.firebaseapp.com",
    databaseURL: "https://mygpslive-57196-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mygpslive-57196",
    storageBucket: "mygpslive-57196.appspot.com",
    messagingSenderId: "20781107701",
    appId: "1:20781107701:android:6c4ac8f292a26b2ebeb8bc"
  };
  firebase.initializeApp(firebaseConfig);

  // Ссылка на текущие координаты пользователя в Firebase
  const dbRef = firebase.database().ref('live_route/user1/current');

  // Инициализация карты
  const map = L.map('map').setView([55.75124, 37.61842], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  // Маркер на карте
  const marker = L.marker([55.75124, 37.61842]).addTo(map);

  // 🔄 Слушаем изменения координат в реальном времени
  dbRef.on('value', snapshot => {
    const data = snapshot.val();
    if (data) {
      marker.setLatLng([data.latitude, data.longitude]);
      map.setView([data.latitude, data.longitude]);
    }
  });
</script>
</body>
</html>
